[package]
name = "ateliet_core"
version = "0.1.0"
description = "Ateliet's core: vault, markdown, search, Dataview, scripts, images"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
# Image search with CLIP (ONNX Runtime). Off for builds that do not need it.
vision = ["dep:ort"]
ort-bundled = ["vision", "ort/download-binaries", "ort/tls-native"]
ort-dynamic = ["vision", "ort/load-dynamic"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
walkdir = "2"
rayon = "1"
regex = "1"
once_cell = "1"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "rayon"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray"], optional = true }
sha2 = "0.10"
unicode-normalization = "0.1"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rquickjs = { version = "0.9", default-features = false, features = ["classes", "properties"] }
