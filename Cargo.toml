[package]
name = "ateliet"
version = "0.1.0"
description = "A minimal, Obsidian-compatible markdown workshop"
edition = "2021"
default-run = "ateliet"

[lib]
name = "ateliet_core"
path = "src/lib.rs"

[[bin]]
name = "ateliet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
notify = "8"
walkdir = "2"
rayon = "1"
regex = "1"
once_cell = "1"
ureq = "2"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
trash = "5"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
