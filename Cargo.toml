[workspace]
members = [".", "core", "native"]

[package]
name = "ateliet"
version = "0.1.0"
description = "A minimal, Obsidian-compatible markdown workshop"
edition = "2021"
default-run = "ateliet"

[[bin]]
name = "ateliet"
path = "src/main.rs"

[features]
# ONNX Runtime (used by the image search) is linked statically from prebuilt
# binaries fetched at build time. `ort-dynamic` loads a system library instead
# (set ORT_DYLIB_PATH), for platforms or sandboxes without those binaries.
default = ["ort-bundled"]
ort-bundled = ["ateliet_core/ort-bundled"]
ort-dynamic = ["ateliet_core/ort-dynamic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ateliet_core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
rayon = "1"
ureq = "2"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
trash = "5"
open = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "rayon"] }
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

# The drawing engine and image decoding are too slow unoptimised to draw with.
[profile.dev.package.ateliet_core]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
