[workspace]
members = [".", "core"]

[package]
name = "ateliet"
version = "0.2.0"
description = "A minimal, Obsidian-compatible markdown workshop"
build = "build.rs"
edition = "2021"
default-run = "ateliet"

[[bin]]
name = "ateliet"
path = "src/main.rs"

[features]
# Search pictures by description (CLIP on ONNX Runtime, fetched at build
# time). `vision-dynamic` loads a system ONNX Runtime instead
# (ORT_DYLIB_PATH); --no-default-features leaves image search by name only.
default = ["vision", "audio"]
# Play the vault's audio in the app (Trilha). On Linux it needs the ALSA
# headers (libasound2-dev / alsa-lib-devel).
audio = ["dep:rodio"]
clip = ["dep:ureq"]
vision = ["clip", "ateliet_core/ort-bundled"]
vision-dynamic = ["clip", "ateliet_core/ort-dynamic"]

[dependencies]
ateliet_core = { path = "core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
raw-window-handle = "0.6"
egui_extras = { version = "0.31", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
regex = "1"
once_cell = "1"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
ureq = { version = "2", optional = true }
trash = "5"
arboard = { version = "3", default-features = false }
ab_glyph = "0.2"
rodio = { version = "0.21", optional = true, default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "symphonia-isomp4", "symphonia-aac"] }
# Only so the old web-view version's updater (`--features tauri/custom-protocol`)
# can build this one; it has no code.
tauri = { path = "compat/tauri", package = "tauri-compat" }

# The drawing engine and image decoding are too slow unoptimised to draw with.
[profile.dev.package.ateliet_core]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2

# The self-updater rebuilds in this profile on the user's machine, so it is
# tuned for rebuild time: with fat LTO and one codegen unit, any change took
# ~7 minutes even with every dependency cached; incremental and parallel
# codegen bring a typical update down to seconds. Dependencies are still built
# at opt-level 3.
[profile.release]
opt-level = 3
incremental = true
strip = true
panic = "abort"
